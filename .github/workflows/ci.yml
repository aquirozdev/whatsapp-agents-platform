name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:contracts
      - run: npm run validate:tenant -- templates/minimal.json
      - run: npm run validate:tenant -- templates/whatsapp-support.json
      - run: npm run validate:tenant -- templates/secure-http-workflow.json
      - run: npm run validate:tenant -- examples/tenant.example.json
      - run: npm run validate:tenant -- examples/financial-institution.reference.json
      - run: npm run synth -- -c stage=test -c defaultModelProvider=bedrock -c defaultModelId=dummy-model -c apiRateLimit=100 -c apiBurstLimit=200 -c deploymentStrategy=direct
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
          CDK_DEFAULT_REGION: us-east-1
      - run: npm run synth -- -c stage=staging -c defaultModelProvider=bedrock -c defaultModelId=dummy-model -c deploymentStrategy=canary10
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
          CDK_DEFAULT_REGION: us-east-1

  floci-integration:
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
    env:
      FLOCI_ENDPOINT_URL: http://127.0.0.1:4566
      AWS_ENDPOINT_URL: http://127.0.0.1:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Wait for Floci
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4566/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Floci did not become ready" >&2
          exit 1
      - run: npm run test:integration
